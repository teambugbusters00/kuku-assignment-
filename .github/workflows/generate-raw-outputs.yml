name: Generate KukuFM Raw Outputs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-raw-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare per-PS folders
        run: |
          mkdir -p Raw_Outputs/PS1 Raw_Outputs/PS2 Raw_Outputs/PS3
          cat > Raw_Outputs/PS1/README.txt <<'EOF'
          PS1 raw outputs are not generated by this workflow because the original PS1 test/input pack is not present in the repository.
          Add the official PS1 inputs and update this workflow to run each test through /api/ps1/tag.
          EOF
          cat > Raw_Outputs/PS2/README.txt <<'EOF'
          PS2 raw outputs are not generated by this workflow because the original listener profiles and catalog test pack are not present in the repository.
          Add the official PS2 inputs and update this workflow to run each test through /api/ps2/recommend.
          EOF

      - name: Generate PS3 Groq AI series continuity output
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 --retry-delay 15 --max-time 21000 \
            "https://kukufm-assignment-api.onrender.com/api/analyze-series" \
            --output Raw_Outputs/PS3/series_analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("Raw_Outputs/PS3/series_analysis.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not isinstance(data.get("pairs"), list):
              raise SystemExit("API response is not a valid PS3 series-analysis result")
          print("PS3 AI output validated:", data.get("episode_count"), "episodes;", data.get("pair_count"), "pairs")
          PY

      - name: Package Raw Outputs ZIP
        run: |
          zip -r KukuFM_Raw_Outputs.zip Raw_Outputs
          ls -lh KukuFM_Raw_Outputs.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KukuFM-Raw-Outputs
          path: KukuFM_Raw_Outputs.zip
          retention-days: 7
